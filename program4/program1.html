<!DOCTYPE html>
<html>
<head>
    <title>DOM Example</title>
</head>
<body>

<h2 id="text">Hello Student</h2>

<button onclick="changeText()">Click Me</button>

<script>
function changeText() {
    document.getElementById("text").innerHTML =
        "Welcome to JavaScript!";
}
</script>

</body>
</html>
