<!DOCTYPE html>
<html>
<head>
    <title>Product Page</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        .product {
            background-color: white;
            width: 250px;
            margin: 50px auto;
            padding: 20px;
            border: 2px solid gray;
        }

        h2 {
            color: green;
        }

        button {
            background-color: green;
            color: white;
            padding: 10px;
            border: none;
        }
    </style>
</head>

<body>

<div class="product">
    <h2>Laptop</h2>
    <p>Price: ₹50,000</p>
    <p>Good quality laptop</p>
    <button>Buy Now</button>
</div>

</body>
</html>
