<!DOCTYPE html>
<html>
<head>
    <title>Student Card</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
            text-align: center;
        }

        .card {
            background-color: white;
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            color: darkblue;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>Student Card</h1>
    <p>Name: Jayashri</p>
    <p>Course: M.Sc CS</p>
    <p>Year: First Year</p>
</div>

</body>
</html>
